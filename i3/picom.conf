backend = "egl";
vsync = true;
use-damage = true;
detect-client-opacity = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.55;
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'Dunst'",
    "_GTK_FRAME_EXTENTS@",
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
corner-radius = 0;

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};
