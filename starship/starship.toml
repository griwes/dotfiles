"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
[](fg:mode_normal bg:mode_insert)\
$directory\
[](fg:mode_insert bg:mode_visual)\
$git_branch\
$git_status\
[](fg:mode_visual bg:mode_terminal)\
$c\
$cmake\
$lua\
$rust\
$golang\
$nodejs\
$python\
[](fg:mode_terminal bg:mode_command)\
$docker_context\
$cmd_duration\
$time\
[ ](fg:mode_command)\
$line_break$character"""

palette = 'nightfox'

[palettes.nightfox]
fg = '#cdcecf'
bg = '#131a24'
tab = '#212e3f'
tab_sel = '#719cd6'
comment = '#738091'
mode_normal = '#7c9cc7'
mode_insert = '#8baf9d'
mode_visual = '#9980c5'
mode_replace = '#c56578'
mode_command = '#d5c18a'
mode_terminal = '#e6a87a'

[os]
disabled = false
style = 'bold bg:mode_normal fg:bg'
format = '[ $symbol]($style)'

[os.symbols]
Arch = '󰣇 '
Artix = '󰣇 '
Debian = '󰣚 '
Fedora = '󰣛 '
Gentoo = '󰣨 '
Linux = '󰌽 '
Macos = '󰀵 '
NixOS = '󱄅 '
Ubuntu = '󰕈 '
Windows = '󰍲 '

[username]
show_always = true
style_user = 'bold bg:mode_normal fg:bg'
style_root = 'bold bg:mode_normal fg:mode_replace'
format = '[ $user ]($style)'

[directory]
style = 'bold bg:mode_insert fg:bg'
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
Developer = '󰲋 '
Documents = '󰈙 '
Downloads = ' '
Music = '󰝚 '
Pictures = ' '

[git_branch]
symbol = ' '
style = 'bold bg:mode_visual fg:bg'
format = '[ $symbol$branch ]($style)'

[git_status]
deleted = '✘ '
style = 'bold bg:mode_visual fg:bg'
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = ' '
style = 'bold bg:mode_terminal fg:bg'
format = '[ $symbol($version) ]($style)'

[cmake]
symbol = ' '
style = 'bold bg:mode_terminal fg:bg'
format = '[ $symbol($version) ]($style)'

[lua]
symbol = ' '
style = 'bold bg:mode_terminal fg:bg'
format = '[ $symbol($version) ]($style)'

[rust]
symbol = ' '
style = 'bold bg:mode_terminal fg:bg'
format = '[ $symbol($version) ]($style)'

[golang]
symbol = ' '
style = 'bold bg:mode_terminal fg:bg'
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = ' '
style = 'bold bg:mode_terminal fg:bg'
format = '[ $symbol($version) ]($style)'

[python]
symbol = ' '
style = 'bold bg:mode_terminal fg:bg'
format = '[ $symbol($version) ]($style)'

[docker_context]
symbol = ' '
style = 'bold bg:mode_command fg:bg'
format = '[ $symbol$context ]($style)'

[cmd_duration]
min_time = 1000
style = 'bold bg:mode_command fg:bg'
format = '[ 󰔚 $duration ]($style)'

[time]
disabled = false
time_format = '%R'
style = 'bold bg:mode_command fg:bg'
format = '[   $time ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[ ](bold fg:mode_insert)'
error_symbol = '[ ](bold fg:mode_replace)'
vimcmd_symbol = '[ ](bold fg:mode_normal)'
vimcmd_replace_one_symbol = '[ ](bold fg:mode_replace)'
vimcmd_replace_symbol = '[ ](bold fg:mode_replace)'
vimcmd_visual_symbol = '[ ](bold fg:mode_visual)'
